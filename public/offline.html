<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Немає звʼязку · Прибрано</title>
<style>
  :root { --bg: #f5f3ee; --ink: #17231f; --ink-2: #46524d; --accent: #1e6b52; --accent-ink: #fff; color-scheme: light dark; }
  @media (prefers-color-scheme: dark) { :root { --bg: #101513; --ink: #e9efeb; --ink-2: #b4beb9; --accent: #6ccba2; --accent-ink: #0b1a13; } }
  body { margin: 0; min-height: 100dvh; display: grid; place-items: center; padding: 16px; background: var(--bg); color: var(--ink); font: 16px/1.55 system-ui, sans-serif; text-align: center; }
  main { max-width: 420px; display: grid; gap: 16px; justify-items: center; }
  h1 { margin: 0; font-size: 28px; line-height: 1.15; }
  p { margin: 0; color: var(--ink-2); }
  button { min-height: 48px; padding: 0 24px; border: 0; border-radius: 999px; background: var(--accent); color: var(--accent-ink); font: inherit; font-weight: 600; cursor: pointer; }
  svg { width: 72px; height: 72px; }
</style>
</head>
<body>
<main>
  <svg viewBox="0 0 32 32" aria-hidden="true"><path d="M16 3c4.6 5.4 9 10.3 9 15.4A9 9 0 0 1 7 18.4C7 13.3 11.4 8.4 16 3Z" fill="currentColor" opacity=".85"/></svg>
  <h1>Немає підключення до інтернету</h1>
  <p>Кошик і введені дані збережено в цьому браузері. Коли звʼязок повернеться, продовжите з того самого місця.</p>
  <button type="button" onclick="location.reload()">Спробувати ще</button>
</main>
</body>
</html>
